<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu roteiro - Bienal do Livro SP</title>
<style>
  :root{
    --bg:#fdf8ee; --ink:#2b2620; --muted:#8a8175; --line:#e7dfcd;
    --red:#e13a3a; --orange:#f2933a; --yellow:#f2c94c; --green:#3aa66a; --blue:#3a86c8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}
  #body{display:flex;flex:1;min-height:0;flex-direction:column;}
  @media (min-width:860px){ #body{ flex-direction:row; } }

  header{padding:10px 14px;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;}
  header h1{font-size:15px;margin:0 0 4px;font-weight:700;}
  header .sub{font-size:11.5px;color:var(--muted);}

  #mapCol{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;}
  #mapWrap{position:relative;flex:1;overflow:hidden;background:#dcd3ba;touch-action:none;}
  #mapInner{position:absolute;top:0;left:0;transform-origin:0 0;width:2600px;}
  #mapInner img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .zoombar{position:absolute;bottom:10px;right:10px;display:flex;gap:4px;z-index:15;}
  .zoombar button{width:34px;height:34px;font-size:17px;padding:0;border:none;border-radius:8px;
    background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .hint{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;
    padding:6px 10px;border-radius:20px;pointer-events:none;transition:opacity .3s;z-index:20;max-width:60%;}

  .pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:5;}
  .pin .dot{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .pin.landmark .dot{width:16px;height:16px;background:#2b2620;}
  .pin.approx .dot{border-style:dashed;opacity:.85;}
  .pin.ghost{z-index:30;}
  .pin.ghost .dot{background:#c81ee0;width:24px;height:24px;animation:pulse 1s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,30,224,.5);}100%{box-shadow:0 0 0 14px rgba(200,30,224,0);}}

  #panel{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;
    justify-content:center;z-index:50;}
  #panel.show{display:flex;}
  #panelCard{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;
    padding:16px;box-shadow:0 -4px 20px rgba(0,0,0,.2);max-height:85vh;overflow-y:auto;}
  #panelCard h3{margin:0 0 10px;font-size:15px;}
  #panelCard label{font-size:11px;color:var(--muted);font-weight:600;display:block;margin:10px 0 4px;}
  #panelCard input[type=text], #panelCard textarea{width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;font-family:inherit;background:#fbf7ee;}
  #panelCard textarea{resize:vertical;min-height:50px;}
  .swatches{display:flex;gap:8px;margin-top:4px;}
  .swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
  .swatch.selected{border-color:#333;}
  .panelBtns{display:flex;gap:8px;margin-top:14px;}
  .panelBtns button{flex:1;padding:10px;font-size:13px;border:none;border-radius:8px;font-weight:600;cursor:pointer;background:#efe8d6;}
  .panelBtns button.primary{background:var(--red);color:#fff;}
  .note{font-size:11.5px;color:var(--muted);background:#faf3e0;border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.4;}
  .note.warn{background:#fdeee0;color:#8a5320;}

  #sidebar{background:#fff;border-top:1px solid var(--line);flex-shrink:0;
    display:flex;flex-direction:column;min-height:0;max-height:42vh;}
  @media (min-width:860px){
    #sidebar{width:340px;border-top:none;border-left:1px solid var(--line);max-height:none;}
  }
  .tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
  .tab{flex:1;padding:10px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .tab.active{color:var(--ink);border-bottom-color:var(--red);}
  .tabPane{display:none;flex-direction:column;min-height:0;flex:1;}
  .tabPane.active{display:flex;}

  .searchBox{padding:10px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .searchBox input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fbf7ee;}
  #sidebarHead{display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:1px solid var(--line);flex-shrink:0;}
  #sidebarHead b{font-size:12.5px;}
  #sidebarHead button, .exportBtn{padding:6px 9px;font-size:11px;border:none;border-radius:8px;background:#efe8d6;cursor:pointer;font-weight:600;}
  #list, #dirList{padding:2px 8px;overflow-y:auto;flex:1;min-height:0;}
  .item{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #f1ece0;}
  .item .dot2{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
  .item .txt{flex:1;min-width:0;}
  .item .txt .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .txt .nt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item button{padding:5px 8px;font-size:11px;border:none;border-radius:6px;background:#efe8d6;cursor:pointer;}
  .empty{padding:20px;text-align:center;color:var(--muted);font-size:12px;}
  .legendRow{display:flex;gap:8px;flex-wrap:wrap;padding:6px 12px 10px;font-size:10px;color:var(--muted);flex-shrink:0;}
  .legendRow span{display:flex;align-items:center;gap:4px;}
  .legendRow i{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .badge{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:9px;flex-shrink:0;}
  .badge.exact{background:#e4e0d6;color:#2b2620;}
  .badge.approx{background:#fdeee0;color:#8a5320;}
</style>
</head>

/* ---- pan & zoom (mouse) ---- */
let dragging=false, dragStart=null, moved=0;
mapWrap.addEventListener('mousedown', e=>{ dragging=true; moved=0; dragStart={x:e.clientX,y:e.clientY,tx,ty}; });
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
  moved=Math.max(moved, Math.hypot(dx,dy));
  tx=dragStart.tx+dx; ty=dragStart.ty+dy; applyTransform();
});
window.addEventListener('mouseup', e=>{
  if(dragging && moved<6) handleTap(e.clientX, e.clientY);
  dragging=false;
});
mapWrap.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, e.deltaY<0?1.15:0.87); }, {passive:false});

/* ---- touch ---- */
let touchState=null;
mapWrap.addEventListener('touchstart', e=>{
  if(e.touches.length===1){ const t=e.touches[0]; touchState={mode:'pan',x:t.clientX,y:t.clientY,tx,ty,moved:0}; }
  else if(e.touches.length===2){
    const [a,b]=e.touches;
    const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const mid={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};
    touchState={mode:'pinch',dist,scaleStart:scale,mid,tx,ty};
  }
}, {passive:true});
mapWrap.addEventListener('touchmove', e=>{
  if(!touchState) return;
  if(touchState.mode==='pan' && e.touches.length===1){
    const t=e.touches[0]; const dx=t.clientX-touchState.x, dy=t.clientY-touchState.y;
    touchState.moved=Math.max(touchState.moved||0, Math.hypot(dx,dy));
    tx=touchState.tx+dx; ty=touchState.ty+dy; applyTransform();
  } else if(touchState.mode==='pinch' && e.touches.length===2){
    const [a,b]=e.touches;
    const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const newScale=clampScale(touchState.scaleStart*(dist/touchState.dist));
    const rect=mapWrap.getBoundingClientRect();
    const mxr=(touchState.mid.x-rect.left-touchState.tx)/touchState.scaleStart;
    const myr=(touchState.mid.y-rect.top-touchState.ty)/touchState.scaleStart;
    tx=touchState.mid.x-rect.left-mxr*newScale; ty=touchState.mid.y-rect.top-myr*newScale;
    scale=newScale; applyTransform();
  }
}, {passive:true});
mapWrap.addEventListener('touchend', ()=>{
  if(touchState && touchState.mode==='pan' && (touchState.moved||0)<8) handleTap(touchState.x, touchState.y);
  touchState=null;
});

function clampScale(s){ return Math.min(4.5, Math.max(0.3, s)); }
function zoomAt(clientX, clientY, factor){
  const rect=mapWrap.getBoundingClientRect();
  const mx=(clientX-rect.left-tx)/scale, my=(clientY-rect.top-ty)/scale;
  scale=clampScale(scale*factor);
  tx=clientX-rect.left-mx*scale; ty=clientY-rect.top-my*scale;
  applyTransform();
}
document.getElementById('zoomIn').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.3);};
document.getElementById('zoomOut').onclick=()=>{const r=mapWrap.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.77);};
document.getElementById('zoomReset').onclick=fitToWidth;

function handleTap(clientX, clientY){
  const rect=mapWrap.getBoundingClientRect();
  const mx=(clientX-rect.left-tx)/scale, my=(clientY-rect.top-ty)/scale;
  const fx=mx/MAP_W, fy=my/MAP_H;
  if(fx<0||fx>1||fy<0||fy>1) return;
  openPanel(null, {x:fx,y:fy});
}
function panTo(fx, fy, zoomLevel){
  const rect=mapWrap.getBoundingClientRect();
  scale = zoomLevel || Math.max(scale, 1.8);
  tx = rect.width/2 - fx*MAP_W*scale;
  ty = rect.height/2 - fy*MAP_H*scale;
  applyTransform();
}

/* ---- directory search & coordinate estimation ---- */
function parseCode(code){
  const m = code.match(/^([A-Z]+)(\d+)/);
  if(!m) return null;
  return {letter:m[1], num:parseInt(m[2],10)};
}
function estimateCoord(code){
  const p = parseCode(code);
  if(!p) return null;
  const row = ROW_MODEL[p.letter];
  if(!row) return null;
  let frac = (row.numMin - p.num) / (row.numMin - row.numMax);
  frac = Math.max(0, Math.min(1, frac));
  const x = row.xMin + frac*(row.xMax - row.xMin);
  // small deterministic jitter on y so overlapping codes don't stack exactly
  const jitter = ((p.num * 13) % 10 - 5) * 0.0015;
  return {x, y: row.y + jitter, approx:true};
}
function findLandmarkByCode(code){
  const hit = LANDMARKS.find(l => l.name.includes('('+code+')') || l.name.toUpperCase()===code.toUpperCase());
  return hit || null;
}

function renderDirList(q){
  q = (q||'').trim().toLowerCase();
  dirListEl.innerHTML='';
  if(!q){
    dirListEl.innerHTML = `<div class="empty">Digite o nome (ou código) de um expositor pra localizar.<br><br>
      <span style="color:#8a5320">Estandes pequenos = posição estimada</span> a partir do padrão de numeração das ruas.<br>
      Grandes atrações e praças = posição exata.</div>`;
    return;
  }
  const results = EXHIBITORS.filter(([code,name]) =>
    name.toLowerCase().includes(q) || code.toLowerCase().includes(q)
  ).slice(0, 40);
  if(results.length===0){
    dirListEl.innerHTML = `<div class="empty">Não encontrei "${escapeHtml(q)}" no catálogo transcrito. Pode ser um estande fora do índice principal, ou grafia diferente — tente parte do nome.</div>`;
    return;
  }
  results.forEach(([code,name])=>{
    const lm = findLandmarkByCode(code);
    const coord = lm || estimateCoord(code);
    const it = document.createElement('div'); it.className='item';
    const badge = lm ? '<span class="badge exact">exato</span>' : (coord ? '<span class="badge approx">estimado</span>' : '');
    it.innerHTML = `<div class="txt"><div class="nm">${escapeHtml(name)}</div><div class="nt">${code}</div></div>
      ${badge}<button data-act="go">Ir</button>`;
    it.querySelector('[data-act=go]').onclick = ()=>{
      if(!coord){ alert('Não tenho localização para esse código no mapa.'); return; }
      jumpToGhost(coord.x, coord.y, name, code, !!coord.approx);
    };
    dirListEl.appendChild(it);
  });
}
function jumpToGhost(x,y,name,code,approx){
  if(ghost){ ghost.remove(); ghost=null; }
  panTo(x,y,2.2);
  const el=document.createElement('div');
  el.className='pin ghost';
  el.style.left=(x*100)+'%'; el.style.top=(y*100)+'%';
  el.innerHTML=`<div class="dot"></div>`;
  mapInner.appendChild(el);
  ghost=el;
  setTimeout(()=>{
    openPanel(null, {x,y}, name + (approx? ' (posição estimada)':''), approx);
  }, 350);
}

dirSearchEl.addEventListener('input', ()=>renderDirList(dirSearchEl.value));

/* ---- panel (add/edit pin) ---- */
function openPanel(id, coord, prefillName, isApprox){
  editingId = id;
  pendingCoord = coord || null;
  const existing = id ? pins.find(p=>p.id===id) : null;
  document.getElementById('panelTitle').textContent = existing ? 'Editar estande' : 'Marcar estande';
  fName.value = existing ? existing.name : (prefillName || '');
  fNote.value = existing ? existing.note : '';
  selectedColor = existing ? existing.color : COLORS[0];
  renderSwatches();
  document.getElementById('deleteBtn').style.display = existing ? 'block' : 'none';
  panelNote.innerHTML = isApprox
    ? `<div class="note warn">Posição estimada pelo padrão de numeração da rua — confira o código físico do estande no local antes de contar com isso ao pé da letra.</div>`
    : '';
  panel.classList.add('show');
  setTimeout(()=>fName.focus(), 100);
}
function closePanel(){
  panel.classList.remove('show'); editingId=null; pendingCoord=null;
  if(ghost){ ghost.remove(); ghost=null; }
}
document.getElementById('cancelBtn').onclick = closePanel;
panel.onclick = (e)=>{ if(e.target===panel) closePanel(); };

document.getElementById('saveBtn').onclick = ()=>{
  const name=fName.value.trim(), note=fNote.value.trim();
  if(!name && !note){ closePanel(); return; }
  if(editingId){
    const p=pins.find(p=>p.id===editingId); p.name=name; p.note=note; p.color=selectedColor;
  } else if(pendingCoord){
    pins.push({id:'p'+Date.now(), x:pendingCoord.x, y:pendingCoord.y, name, note, color:selectedColor});
  }
  closePanel(); renderPins(); renderList(); save();
};
document.getElementById('deleteBtn').onclick = ()=>{
  pins = pins.filter(p=>p.id!==editingId);
  closePanel(); renderPins(); renderList(); save();
};
document.getElementById('clearAll').onclick = ()=>{
  if(pins.length===0) return;
  if(confirm('Remover todos os estandes marcados?')){ pins=[]; renderPins(); renderList(); save(); }
};
document.getElementById('exportBtn').onclick = ()=>{
  if(pins.length===0){ alert('Nenhum estande marcado ainda.'); return; }
  const catNames={'#e13a3a':'Alta','#f2933a':'Média','#f2c94c':'Curiosidade','#3aa66a':'Visitei','#3a86c8':'Outro'};
  const text = pins.map((p,i)=> `${i+1}. ${p.name||'(sem nome)'} [${catNames[p.color]||''}]${p.note?' - '+p.note:''}`).join('\n');
  navigator.clipboard.writeText(text).then(()=>alert('Lista copiada!')).catch(()=>prompt('Copie sua lista:', text));
};
searchEl.addEventListener('input', renderList);

let hinted=false;
function dismissHint(){ if(!hinted){ hinted=true; hint.style.opacity='0'; } }
mapWrap.addEventListener('mousedown', dismissHint);
mapWrap.addEventListener('touchstart', dismissHint);

/* ---- persistence ---- */
async function save(){
  try{ await window.storage.set('bienal-pins', JSON.stringify(pins), false); }
  catch(e){ console.error('storage save failed', e); }
}
async function load(){
  try{
    const res = await window.storage.get('bienal-pins', false);
    if(res && res.value) pins = JSON.parse(res.value);
  }catch(e){ /* no data yet */ }
  renderPins(); renderList();
}
</script>
